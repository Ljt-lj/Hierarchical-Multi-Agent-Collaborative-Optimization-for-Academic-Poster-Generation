# AMD ROCm 云 GPU 配置（禁用 4bit，fp16 LoRA）
# 先下载模型: python training/scripts/download_model.py --model qwen2.5-7b
# 训练时: --model-path training/models/Qwen2.5-7B-Instruct
task: refiner
base_model: Qwen/Qwen2.5-7B-Instruct
local_model_dir: models/Qwen2.5-7B-Instruct
train_file: data/processed/refiner_train.jsonl
val_file: data/processed/refiner_val.jsonl
output_dir: outputs/refiner_lora_rocm

num_train_epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-4
warmup_ratio: 0.03
max_seq_length: 3072
logging_steps: 10
eval_steps: 200
save_steps: 400
save_total_limit: 3

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

load_in_4bit: false
bf16: false
fp16: true
seed: 42
