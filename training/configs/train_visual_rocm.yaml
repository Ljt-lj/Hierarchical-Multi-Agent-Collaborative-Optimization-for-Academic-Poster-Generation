# AMD ROCm Visual Agent
task: visual
base_model: Qwen/Qwen2.5-7B-Instruct
train_file: data/processed/visual_train.jsonl
val_file: data/processed/visual_val.jsonl
output_dir: outputs/visual_lora_rocm

num_train_epochs: 2
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.5e-4
warmup_ratio: 0.03
max_seq_length: 2048
logging_steps: 10
eval_steps: 150
save_steps: 300
save_total_limit: 3

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

load_in_4bit: false
bf16: false
fp16: true
seed: 42
