# 低显存配置（6~8GB VRAM）：Qwen2.5-1.5B + 短序列
task: refiner
base_model: Qwen/Qwen2.5-1.5B-Instruct
train_file: data/processed/refiner_train.jsonl
val_file: data/processed/refiner_val.jsonl
output_dir: outputs/refiner_lora_1.5b

num_train_epochs: 3
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-4
warmup_ratio: 0.03
max_seq_length: 2048
logging_steps: 10
eval_steps: 200
save_steps: 400
save_total_limit: 2

lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

load_in_4bit: false
bf16: false
fp16: true
seed: 42
