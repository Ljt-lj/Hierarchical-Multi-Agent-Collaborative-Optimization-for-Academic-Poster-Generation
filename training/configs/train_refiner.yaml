# Refiner Agent LoRA 微调配置
task: refiner
base_model: Qwen/Qwen2.5-7B-Instruct
train_file: data/processed/refiner_train.jsonl
val_file: data/processed/refiner_val.jsonl
output_dir: outputs/refiner_lora

# 训练超参
num_train_epochs: 3
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
warmup_ratio: 0.03
max_seq_length: 4096
logging_steps: 10
eval_steps: 200
save_steps: 400
save_total_limit: 3

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# 量化（Windows 无 bitsandbytes 时自动关闭）
load_in_4bit: true
bf16: true
seed: 42
